version: '3.9'
services:
  votacao-db:
    image: postgres:18.6
    container_name: votacao-db
    environment:
      - TZ=UTC
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=votacao-dev
    ports:
      - 5000:5432
    volumes:
      - db-data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db-data: