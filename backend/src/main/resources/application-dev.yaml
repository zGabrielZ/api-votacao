spring:
  datasource:
    url: jdbc:postgresql://localhost:5000/votacao-dev?currentSchema=dev
    username: admin
    password: admin
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: '/api'